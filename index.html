<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oppo Campanhas</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --accent: #078768;
      --accent-dark: #056b53;
      --ink: #19231f;
      --muted: #6d7772;
      --line: rgba(25, 35, 31, .09);
      --surface: #fff;
      --max-width: 1160px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      font-family: Montserrat, "Segoe UI", sans-serif;
      line-height: 1.55;
      background:
        radial-gradient(ellipse at 94% 0%, rgba(0, 168, 132, .09), transparent 34rem),
        #f6f8f6;
      -webkit-font-smoothing: antialiased;
    }

    .header-nav-main {
      position: sticky;
      top: 0;
      z-index: 60;
      height: 76px;
      border-bottom: 1px solid rgba(25, 35, 31, .06);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(16px);
    }

    .header-nav-main .nav-inner {
      display: flex;
      align-items: center;
      width: min(100%, 1240px);
      height: 100%;
      margin: 0 auto;
      padding: 0 30px;
    }

    .nav-logo {
      display: inline-flex;
      align-items: center;
      gap: 0;
      color: inherit;
      text-decoration: none;
    }

    .nav-logo img {
      display: block;
      width: 80px;
      height: 80px;
      margin-right: -6px;
      object-fit: contain;
    }

    .nav-logo .logo-text {
      color: #34413b;
      font-size: 15px;
      font-weight: 400;
      white-space: nowrap;
    }

    .site {
      width: min(100%, var(--max-width));
      margin: 0 auto;
      padding: clamp(38px, 5vw, 64px) 28px 88px;
    }

    .hero-header {
      margin: 0 0 24px;
    }

    .badge-new {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      padding: 7px 12px;
      border: 1px solid rgba(7, 135, 104, .14);
      border-radius: 999px;
      color: var(--accent-dark);
      background: rgba(7, 135, 104, .07);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      line-height: 1;
      text-transform: uppercase;
    }

    .badge-new::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #0da779;
      box-shadow: 0 0 0 3px rgba(13, 167, 121, .12);
      content: "";
    }

    .hero-header h1 {
      max-width: 760px;
      margin: 0;
      color: #17231e;
      font-size: clamp(30px, 4vw, 46px);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: 1.14;
    }

    .hero-header p {
      max-width: 600px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(25, 35, 31, .08);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 20px 58px rgba(28, 48, 39, .10), 0 2px 8px rgba(28, 48, 39, .04);
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .hero .clickable {
      position: absolute;
      inset: 0;
      border: 0;
      border-radius: inherit;
      background: transparent;
      cursor: pointer;
    }

    .hero .clickable:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: -5px;
    }

    @media (hover: hover) {
      .hero:hover {
        transform: translateY(-3px);
        box-shadow: 0 26px 68px rgba(28, 48, 39, .14), 0 3px 10px rgba(28, 48, 39, .05);
      }
    }

    .section {
      margin-top: 76px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
    }

    .section-header {
      margin-bottom: 26px;
    }

    .section-eyebrow {
      display: block;
      margin-bottom: 8px;
      color: var(--accent-dark);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .section-header h2 {
      margin: 0;
      color: #1b2822;
      font-size: clamp(24px, 3vw, 30px);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.2;
    }

    .section-header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .campaign-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
      gap: 18px;
    }

    .campaign-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(25, 35, 31, .08);
      border-radius: 19px;
      background: var(--surface);
      box-shadow: 0 8px 26px rgba(28, 48, 39, .055);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .45s ease, transform .45s ease, box-shadow .25s ease;
    }

    .campaign-card.visible {
      opacity: 1;
      transform: none;
    }

    .campaign-media {
      flex: 0 0 auto;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-bottom: 1px solid rgba(25, 35, 31, .05);
      background: #f4f5f2;
    }

    .campaign-media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .campaign-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 20px 20px 18px;
    }

    .campaign-body h3 {
      margin: 0 0 5px;
      color: #202c26;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.015em;
      line-height: 1.4;
      text-align: left;
    }

    .campaign-body p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: left;
    }

    .campaign-links {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .campaign-link-btn {
      display: flex;
      width: 100%;
      max-width: 176px;
      flex: 1 1 132px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      aspect-ratio: 1;
      padding: 8px;
      border: 1px solid rgba(25, 35, 31, .08);
      border-radius: 14px;
      background: #fafbf9;
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .campaign-link-btn img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .campaign-link-btn:focus-visible {
      outline: 3px solid rgba(7, 135, 104, .55);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .campaign-card:hover {
        box-shadow: 0 14px 34px rgba(28, 48, 39, .10);
      }

      .campaign-link-btn:hover {
        transform: translateY(-2px);
        border-color: rgba(7, 135, 104, .35);
        background: #fff;
        box-shadow: 0 8px 18px rgba(28, 48, 39, .08);
      }
    }

    @media (max-width: 900px) {
      .campaign-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .header-nav-main { height: 64px; }
      .header-nav-main .nav-inner { padding: 0 20px; }
      .nav-logo img { width: 62px; height: 62px; }

      .site { padding: 36px 18px 64px; }
      .hero-header { margin-bottom: 19px; }
      .hero-header h1 { font-size: clamp(29px, 8vw, 38px); }
      .hero-header p { margin-top: 9px; font-size: 14px; }
      .hero { border-radius: 17px; }

      .section { margin-top: 58px; padding-top: 26px; }
      .section-header { margin-bottom: 20px; }
      .campaign-list { grid-template-columns: minmax(0, 1fr); gap: 15px; }
      .campaign-card { border-radius: 17px; }
      .campaign-body { padding: 18px; }
      .campaign-link-btn { flex-basis: 138px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

<header class="header-nav-main">
  <div class="nav-inner">
    <a class="nav-logo">
      <img src="oppo-logo-0.png" alt="OPPO">
      <span class="logo-text">Campanhas</span>
    </a>
  </div>
</header>

<main class="site">

  <!--
  <div class="hero-header">
    <div class="badge-new">Campanha a decorrer</div>
    <h1 id="heroTitle">Campanhas OPPO em destaque</h1>
    <p id="heroSubtitle">Explora as ofertas atuais e consulta todos os detalhes da campanha.</p>
  </div>
  
  <section class="hero" id="hero">
    <img id="heroImg" src="imagem_campanha_botao_3.jpg">
    <button class="clickable" id="heroBtn" aria-label="Ver campanha atual"></button>
  </section>
  -->


  <section class="section" aria-labelledby="previousCampaignsTitle">
    <div class="section-header">
      <span class="section-eyebrow">Arquivo de campanhas</span>
      <h2 id="previousCampaignsTitle">Campanhas terminadas</h2>
      <p>Revisita as ofertas e consulta os documentos das campanhas anteriores.</p>
    </div>
    <div class="campaign-list" id="campaignList"></div>
  </section>

</main>

<script>
const previous = [
  {
    title: 'Campanha OPPO Find X9 Ultra',
    subtitle: 'Documentos e ofertas da campanha',
    image: 'rosto_campanha_find_x9_ultra.png',
    links: [
      {
        img: 'teleconversor_maio_2026.png',
        href: './OPPO Find X9 Ultra_Termos e Condições.pdf'
      }
    ]
  },
  {
    title: 'Campanha OPPO Reno15 Pro 5G',
    subtitle: 'Documentos e ofertas da campanha',
    image: 'imagem_campanha_botao.jpg',
    links: [
      {
        img: 'campanha_reno_15_watch.png',
        href: './OPPO reno15 Pro 5G Oferta Watch S F.pdf'
      }
    ]
  },
  {
    title: 'Campanha Oppo Find X9 Pro',
    subtitle: 'Documentos e ofertas da campanha',
    image: 'rosto_campanha_antiga.png',
    links: [
      { img: 'teleconversor.png', href: './OPPO Find X9 PRO _Oferta Teleconversor.pdf' },
      { img: 'watch.png', href: './OPPO Find X9 PRO _Oferta Watch.pdf' }
    ]
  }
];


const currentCampaignUrl = './campanha.html';
const heroBtn = document.getElementById('heroBtn');

if (heroBtn) {
  heroBtn.addEventListener('click', () => {
    window.location.href = currentCampaignUrl;
  });
}

const list = document.getElementById('campaignList');

previous.forEach(c=>{
  const card=document.createElement('article');
  card.className='campaign-card';
  card.innerHTML=`
    <div class="campaign-media"><img src="${c.image}"></div>
    <div class="campaign-body">
      <h3>${c.title}</h3>
      <p>${c.subtitle}</p>
      <div class="campaign-links">
        ${c.links.map(l=>`<a class="campaign-link-btn" href="${l.href}" target="_blank"><img src="${l.img}"></a>`).join('')}
      </div>
    </div>
  `;
  list.appendChild(card);
});

const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
      io.unobserve(e.target);
    }
  });
});

document.querySelectorAll('.campaign-card').forEach(c=>io.observe(c));
</script>

</body>
</html>
