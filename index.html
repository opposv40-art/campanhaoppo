<!DOCTYPE html>

<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Campanha OPPO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2b2d42;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #444;
    }
    input, select {
      width: 95.5%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    input[type="file"] {
        width: 100%;
        border: none;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #00a884;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #008f72;
    }
    .success {
      text-align: center;
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://logodownload.org/wp-content/uploads/2021/03/oppo-logo-0.png" alt="Oppo Logo" width="32" height="32">
    <h2>Campanha OPPO</h2>
    <form id="oppoForm">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>

  <label for="telefone">Telefone:</label>
  <input type="tel" id="telefone" name="telefone" required>

  <label for="morada">Morada:</label>
  <input type="text" id="morada" name="morada" required>

  <label for="loja">Loja onde comprou:</label>
  <input type="text" id="loja" name="loja" required>

  <label for="fatura">Upload da Fatura:</label>
  <input type="file" id="fatura" name="fatura" accept=".jpg,.png,.pdf" required>

  <button type="submit">Submeter</button>
</form>
<p class="success" id="successMsg" style="display:none;">Formulário enviado com sucesso!</p>

  </div>

  <script>
    document.getElementById("oppoForm").addEventListener("submit", function(event) {
      event.preventDefault(); // impede refresh
      document.getElementById("successMsg").style.display = "block";
      this.reset(); // limpa formulário
    });
  </script>

</body>
</html>
