<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oppo Campanhas</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{--accent:#00a884;--bg:#f4f4f9;--max-width:1200px}
    *{box-sizing:border-box}
    body{font-family:Montserrat;background:var(--bg);margin:0;color:#111}

    .site{max-width:var(--max-width);margin:0 auto;padding:18px}

    .header-nav-main{
      position: sticky;
      top: 0;
      z-index: 60;
      height: 58px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.06);
    }

    .header-nav-main .nav-inner{
      max-width: none;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .nav-logo{
      display: inline-flex;
      align-items: center;
    }

    .nav-logo img{
      height: 70px;
      transform: scale(1.35);
      transform-origin: left center;
      margin-right: 16px;
    }

    .nav-logo .logo-text{
      font-size: 15px;
      font-weight: 370;
      line-height: 2;
      color: #000;
      white-space: nowrap;
    }

    .badge-new{
      display:inline-block;padding:6px 12px;border-radius:999px;
      font-size:13px;font-weight:700;color:#fff;
      background:linear-gradient(135deg,#00e6a8 0%,#00c896 40%,#00a884 100%);
      box-shadow:0 8px 22px rgba(0,168,132,.25);
      margin-bottom:6px;
    }

    .hero{
      position:relative;
      border-radius:10px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 20px 48px rgba(15,22,35,.1);
      transition:.3s;
    }
    .hero:hover{transform:translateY(-6px) scale(1.01)}

    .hero img{width:100%;object-fit:contain}

    .hero .clickable{
      position:absolute;
      inset:0;
      border:0;
      background:transparent;
      cursor:pointer;
    }

    .hero-header h1{font-size:26px;font-weight:400;margin:0}
    .hero-header p{margin:6px 0 18px;color:#444}

    .section{margin-top:32px;border-top:1px solid rgba(0,0,0,.08);padding-top:18px}
    .section h3{text-align:center;font-weight:400;font-size:22px;margin-bottom:16px}

    .campaign-list{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
      align-items:flex-start;
    }

    .campaign-card{
      background:#fff;
      width:460px;
      border-radius:10px;
      box-shadow:0 12px 26px rgba(0,0,0,.1);
      opacity:0;
      transform:translateY(16px);
      transition:.35s;
    }

    .campaign-card.visible{opacity:1;transform:none}

    .campaign-media{aspect-ratio:2/1}
    .campaign-media img{width:100%;object-fit:contain}

    .campaign-body{padding:10px 14px}
    .campaign-body h3{font-size:15px;margin:0 0 4px}
    .campaign-body p{font-size:13px;color:#666;text-align:center;margin:0}

    .campaign-links{
      display:flex;
      justify-content:center;
      gap:14px;
      margin-top:12px;
    }

    .campaign-link-btn{
      width:175px;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 6px 14px rgba(0,0,0,.12);
      transition:.25s;
    }

    .campaign-link-btn img{width:100%;display:block}
    .campaign-link-btn:hover{transform:translateY(-3px) scale(1.04)}
  </style>
</head>
<body>

<header class="header-nav-main">
  <div class="nav-inner">
    <a class="nav-logo">
      <img src="oppo-logo-0.png">
      <span class="logo-text">Campanhas</span>
    </a>
  </div>
</header>

<div class="site">

  <!-- CAMPANHA A DECORRER (DESATIVADA) -->
  <!--
  <div class="hero-header">
    <div class="badge-new">Campanha a decorrer</div>
    <h1 id="heroTitle"></h1>
    <p id="heroSubtitle"></p>
  </div>

  <section class="hero" id="hero">
    <img id="heroImg" src="imagem_campanha_botao_2.png">
    <button class="clickable" id="heroBtn" aria-label="Ver campanha atual"></button>
  </section>
  -->

  <section class="section">
    <h3>Campanhas terminadas</h3>
    <div class="campaign-list" id="campaignList"></div>
  </section>

</div>

<script>
const previous = [
  {
    title: 'Campanha OPPO Reno15 Pro 5G',
    subtitle: 'Documentos e ofertas da campanha',
    image: 'imagem_campanha_botao.jpg',
    links: [
      {
        img: 'campanha_reno_15_watch.png',
        href: './OPPO reno15 Pro 5G Oferta Watch S F.pdf'
      }
    ]
  },
  {
    title: 'Campanha Oppo Find X9 Pro',
    subtitle: 'Documentos e ofertas da campanha',
    image: 'rosto_campanha_antiga.png',
    links: [
      { img: 'teleconversor.png', href: './OPPO Find X9 PRO _Oferta Teleconversor.pdf' },
      { img: 'watch.png', href: './OPPO Find X9 PRO _Oferta Watch.pdf' }
    ]
  }
];

const currentCampaignUrl = './campanha.html';
const heroBtn = document.getElementById('heroBtn');

if (heroBtn) {
  heroBtn.addEventListener('click', () => {
    window.location.href = currentCampaignUrl;
  });
}

const list = document.getElementById('campaignList');

previous.forEach(c=>{
  const card=document.createElement('article');
  card.className='campaign-card';
  card.innerHTML=`
    <div class="campaign-media"><img src="${c.image}"></div>
    <div class="campaign-body">
      <h3>${c.title}</h3>
      <p>${c.subtitle}</p>
      <div class="campaign-links">
        ${c.links.map(l=>`<a class="campaign-link-btn" href="${l.href}" target="_blank"><img src="${l.img}"></a>`).join('')}
      </div>
    </div>
  `;
  list.appendChild(card);
});

const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
      io.unobserve(e.target);
    }
  });
});

document.querySelectorAll('.campaign-card').forEach(c=>io.observe(c));
</script>

</body>
</html>
