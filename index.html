<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oppo Campanhas</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{--accent:#00a884;--bg:#f4f4f9;--max-width:1200px}
    *{box-sizing:border-box}
    body{font-family:Montserrat;background:var(--bg);margin:0;color:#111}

    .site{max-width:var(--max-width);margin:0 auto;padding:18px}

    /* HEADER */
    .header-nav-main{
      position: sticky;
      top: 0;
      z-index: 60;
      height: 58px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.06);
    }

    .header-nav-main .nav-inner{
      width: 100%;
      height: 100%;
      padding: 0 24px;
      display: flex;
      align-items: center;
    }

    .nav-logo{
      display: inline-flex;
      align-items: center;
    }

    .nav-logo img{
      height: 70px;
      transform: scale(1.35);
      transform-origin: left center;
      margin-right: 33px;
    }

    .nav-logo .logo-text{
      font-size: 15px;
      font-weight: 370;
      line-height: 2;
      color: #000;
      white-space: nowrap;
    }

    /* ESCONDER CAMPANHA A DECORRER */
    .hero-header,
    .hero{
      display:none;
    }

    .section{
      margin-top:32px;
      border-top:1px solid rgba(0,0,0,.08);
      padding-top:18px
    }

    .section h3{
      text-align:center;
      font-weight:400;
      font-size:22px;
      margin-bottom:16px
    }

    .campaign-list{
      display:flex;
      justify-content:center;
      flex-direction:column;
      gap:22px;
      align-items:center;
    }

    .campaign-card{
      background:#fff;
      width:460px;
      border-radius:10px;
      box-shadow:0 12px 26px rgba(0,0,0,.1);
      opacity:0;
      transform:translateY(16px);
      transition:.35s;
    }

    .campaign-card.visible{
      opacity:1;
      transform:none
    }

    .campaign-media{
      aspect-ratio:2/1
    }

    .campaign-media img{
      width:100%;
      object-fit:contain
    }

    .campaign-body{
      padding:12px 16px;
      text-align:center;
    }

    .campaign-body h3{
      font-size:15px;
      margin:0 0 6px
    }

    .campaign-body p{
      font-size:13px;
      color:#666;
      margin:0 0 8px
    }

    .campaign-links{
      margin-top:6px;
    }

    .campaign-link-btn{
      width:175px;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 6px 14px rgba(0,0,0,.12);
      transition:.25s;
    }

    .campaign-link-btn img{
      width:100%;
      display:block
    }

    .campaign-link-btn:hover{
      transform:translateY(-3px) scale(1.04)
    }
  </style>
</head>
<body>

<header class="header-nav-main">
  <div class="nav-inner">
    <a class="nav-logo">
      <img src="oppo-logo-0.png">
      <span class="logo-text">Campanhas</span>
    </a>
  </div>
</header>

<div class="site">

  <section class="section">
    <h3>Campanhas terminadas</h3>
    <div class="campaign-list" id="campaignList"></div>
  </section>

</div>

<script>
const previous = [
  {
    title: 'Campanha OPPO Reno15 Pro 5G',
    subtitle: 'Documento da campanha',
    image: 'imagem_campanha_botao.jpg',
    textLink: `
      <a href="./OPPO reno15 Pro 5G Oferta Watch S F.pdf"
         target="_blank"
         style="color:#00a884;text-decoration:underline;">
        OPPO Reno15 Pro 5G
      </a>
    `
  },
  {
    title: 'Campanha Oppo Find X9 Pro',
    subtitle: 'Documentos e ofertas da campanha',
    image: 'rosto_campanha_antiga.png',
    links: [
      { img: 'teleconversor.png', href: './OPPO Find X9 PRO _Oferta Teleconversor.pdf' },
      { img: 'watch.png', href: './OPPO Find X9 PRO _Oferta Watch.pdf' }
    ]
  }
];

const list = document.getElementById('campaignList');

previous.forEach(c => {
  const card = document.createElement('article');
  card.className = 'campaign-card';

  let linksHtml = '';

  if (c.textLink) {
    linksHtml = `<div class="campaign-links">${c.textLink}</div>`;
  } else if (c.links && c.links.length) {
    linksHtml = `
      <div class="campaign-links">
        ${c.links.map(l => `
          <a class="campaign-link-btn" href="${l.href}" target="_blank">
            <img src="${l.img}">
          </a>
        `).join('')}
      </div>
    `;
  }

  card.innerHTML = `
    <div class="campaign-media">
      <img src="${c.image}">
    </div>
    <div class="campaign-body">
      <h3>${c.title}</h3>
      <p>${c.subtitle || ''}</p>
      ${linksHtml}
    </div>
  `;

  list.appendChild(card);
});

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      io.unobserve(e.target);
    }
  });
});

document.querySelectorAll('.campaign-card').forEach(c => io.observe(c));
</script>

</body>
</html>
