<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login - Campanha OPPO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(180deg, #cfe8f7 0%, #f3f5f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 340px;
      text-align: center;
    }

    h1 {
      color: #198896;
      margin-bottom: 24px;
      font-size: 22px;
    }

    input {
      width: 83%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
    }

    button {
      width: 100%;
      background-color: #198896;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #146d77;
    }

    .error {
      color: #c62828;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Campanha OPPO</h1>
    <input type="text" id="username" placeholder="Utilizador" required>
    <input type="password" id="password" placeholder="Palavra-passe" required>
    <button onclick="fazerLogin()">Entrar</button>
    <div class="error" id="erroLogin"></div>
  </div>

  <script>
    async function fazerLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const erroEl = document.getElementById("erroLogin");
      erroEl.textContent = "";

      if (!username || !password) {
        erroEl.textContent = "Por favor preencha todos os campos.";
        return;
      }

      try {
        const resp = await fetch("http://localhost:8000/api/externos/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await resp.json();

        if (!resp.ok || !data.success) {
          erroEl.textContent = data.message || "Credenciais inválidas.";
          return;
        }

        // ✅ Guarda o token JWT
        localStorage.setItem("token", data.access_token);
        localStorage.setItem("refresh_token", data.refresh_token);

        // ✅ Redireciona para a página principal
        window.location.href = "./backoffice.html";
      } catch (err) {
        console.error("Erro ao fazer login:", err);
        erroEl.textContent = "Erro de ligação ao servidor.";
      }
    }

    // Se já estiver logado, redireciona direto
    if (localStorage.getItem("token")) {
      window.location.href = "./backoffice.html";
    }
  </script>

</body>
</html>
