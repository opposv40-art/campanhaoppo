<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Registo Concluído</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0px 6px 18px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }
    h2 {
      color: #00a884;
      font-weight: 700;
      margin-bottom: 18px;
    }
    p {
      color: #2b2d42;
      font-size: 18px;
      font-weight: 400;
      margin-top: 10px;
    }
    .success-icon {
      font-size: 48px;
      color: #00a884;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">✔️</div>
    <h2>Submissão Concluída</h2>
    <p>Submeteu o formulário com sucesso.<br>Vai receber um email de confirmação.</p>
  </div>
</body>
</html>
